services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: playsms
      MYSQL_USER: playsms
      MYSQL_PASSWORD: playsmspass
    volumes:
      - dbdata:/var/lib/mysql

  playsms:
    image: playsms/playsms:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # These env vars might depend on the image implementation
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: playsms
      DB_USER: playsms
      DB_PASS: playsmspass
    depends_on:
      - db

volumes:
  dbdata:
